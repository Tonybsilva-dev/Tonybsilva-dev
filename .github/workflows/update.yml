name: Atualizar README

on:
  schedule:
    - cron: "0 6 * * *"  # Executa diariamente às 6h UTC (3h BR)
  workflow_dispatch:  # Permite execução manual
  push:
    branches: [ main, master ]  # Executa quando há push na branch principal

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualizar README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          echo "🔄 Iniciando atualização automática do README..."
          echo "👤 Username: ${{ github.repository_owner }}"
          echo "📁 Repositório: ${{ github.repository }}"
          python update_readme.py

      - name: Verificar mudanças
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📊 Mudanças detectadas no README"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ Nenhuma mudança detectada"
          fi

      - name: Commit e Push das mudanças
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza README automaticamente 📊
          
          - Atualiza tabela de projetos recentes
          - Atualiza tabela de commits
          - Última atualização: $(date -u '+%d/%m/%Y %H:%M:%S UTC')"
          git push

      - name: Resumo da execução
        run: |
          echo "🎉 Workflow concluído com sucesso!"
          echo "📅 Executado em: $(date -u)"
          if [ "${{ steps.git-check.outputs.has_changes }}" == "true" ]; then
            echo "✅ README atualizado e commitado"
          else
            echo "ℹ️ README já estava atualizado"
          fi